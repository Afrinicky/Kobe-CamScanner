name: Build APK

on:
  push:
    branches: [ "claude/kobe-camscanner-app-xikntz", "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # The debug build is signed with the runner's auto-generated debug keystore, which is all an
      # APK needs to be installable by hand. A release build would need a real signing key.
      - name: Stage the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/kobe-camscanner-debug.apk"
          ls -lh dist

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobe-camscanner-debug-apk
          path: dist/kobe-camscanner-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Also published as a release asset, which is a plain download link rather than a zip
      # behind the Actions UI.
      - name: Publish to the rolling dev release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-latest"
          NOTES="Automatic debug build of \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\`.

          Unsigned for release, signed with the standard Android debug key — installable by hand,
          not through the Play Store. On your phone: allow installs from unknown sources for your
          browser or file manager, then open the APK.

          Built $(date -u '+%Y-%m-%d %H:%M UTC')."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "Kobe CamScanner — latest debug build"
            gh release upload "$TAG" dist/kobe-camscanner-debug.apk --clobber
          else
            gh release create "$TAG" dist/kobe-camscanner-debug.apk \
              --title "Kobe CamScanner — latest debug build" \
              --notes "$NOTES" \
              --prerelease
          fi

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
